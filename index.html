": "Halq / Taqsir", "ar": "الحلق أو التقصير", "src": "pdf"}, {"k": "hajj", "t": "Word / Term", "en": "Tawaf al-Wada", "ar": "طواف الوداع", "src": "pdf"}, {"k": "ethics", "t": "Word / Term", "en": "Bismillah", "ar": "بسم الله", "src": "pdf"}, {"k": "ethics", "t": "Word / Term", "en": "Alhamdulillah", "ar": "الحمد لله", "src": "pdf"}], "qa": [["What does the word Islam mean, and who is a Muslim?", "ماذا تعني كلمة إسلام، ومن هو المسلم؟", "Islam means peaceful submission to the will of God. A Muslim is someone who willingly submits to God and lives in peace.", "الإسلام يعني الاستسلام المسالم لله والطاعة له. والمسلم هو من يخضع لله بإرادته ويعيش بسلام مع نفسه ومع الخلق."], ["Is Allah a different God from the God of Jews and Christians?", "هل الله إله مختلف عن إله اليهود والنصارى؟", "No. Allah is the Arabic name of the one God, the Creator. Arabic-speaking Jews and Christians use the same word.", "لا، الله هو الاسم العربي للإله الواحد الخالق، واليهود والنصارى العرب يستخدمون اللفظ نفسه."], ["Do Muslims worship Muhammad?", "هل يعبد المسلمون محمدًا؟", "No. Muslims worship Allah alone. Muhammad is a human being and the final messenger of God.", "لا، المسلمون يعبدون الله وحده، ومحمد إنسان وهو خاتم رسل الله."], ["What is the Quran, and how was it preserved?", "ما هو القرآن، وكيف حُفظ؟", "The Quran is the word of God revealed to Prophet Muhammad through the angel Gabriel. It has been preserved word for word.", "القرآن كلام الله المنزل على النبي محمد بواسطة جبريل، وقد حُفظ حرفًا بحرف عبر القرون."], ["Are women oppressed in Islam?", "هل تُظلم المرأة في الإسلام؟", "No. Islam gave women rights such as education, owning property, inheritance and choosing a spouse.", "لا، الإسلام منح المرأة حقوقًا مثل التعليم والتملك والميراث واختيار الزوج."], ["Isn't praying five times a day difficult?", "أليست الصلاة خمس مرات في اليوم شاقة؟", "Each prayer takes only a few minutes, and it reminds us of Allah and keeps us away from wrongdoing.", "كل صلاة تستغرق دقائق قليلة، وهي تذكّرنا بالله وتبعدنا عن الذنوب."], ["Does Islam promote violence?", "هل يدعو الإسلام إلى العنف؟", "No. Islam forbids killing innocent people and teaches justice, compassion and peace.", "لا، الإسلام يحرّم قتل الأبرياء ويعلّم العدل والرحمة والسلام."], ["What is required to become a Muslim?", "ماذا يلزم لكي يصبح الإنسان مسلمًا؟", "A person believes in their heart and declares the Shahada: there is no god but Allah, and Muhammad is His messenger.", "يؤمن الإنسان بقلبه وينطق الشهادتين: لا إله إلا الله، ومحمد رسول الله."]]}</script><script src="islam_docx.js"></script></head><body><div id="app"></div><div class="mu c" style="padding:6px;font-size:11px">v10-b</div>

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function fix(w){w=w.toLowerCase();if(w.length<3||D[w]||SW.has(w))return w;
if(U&&U.words.some(x=>x.en===w))return w;
let best=w,bd=9;const pool=Object.keys(D).concat(U?U.words.map(x=>x.en):[]);
for(const p of pool){if(Math.abs(p.length-w.length)>2||p.includes(' '))continue;const d=lev(w,p);if(d<bd){bd=d;best=p}}
return bd<=(w.length>4?2:1)?best:w}
function fixS(s){return s.replace(/[A-Za-z]+/g,(m,o)=>{if(m.length<4||(o>0&&m[0]!==m[0].toLowerCase()))return m;const f=fix(m);return f===m.toLowerCase()?m:f})}

const POL=`<h3>سياسة الخصوصية وشروط الاستخدام</h3>
<p><b>1. من نحن:</b> تطبيق خطيب لتعلّم اللغة الإنجليزية والمنافسة بين الطلاب. تُدار الخدمة بواسطة إدارة التطبيق.</p>
<p><b>2. البيانات التي نجمعها:</b> اسم المستخدم، والاسم الكامل، والنوع، وتاريخ الميلاد، ورقم هاتف الطالب (اختياري)، ورقم هاتف ولي الأمر، والصورة الشخصية (اختيارية)، ونتائج التعلّم والتحديات، والرسائل والمنشورات التي ينشرها الطالب.</p>
<p><b>3. موافقة ولي الأمر:</b> الطفل الذي يقل عمره عن 18 سنة لا يستخدم التطبيق إلا بموافقة ولي الأمر، ويُطلب رقم هاتفه للتواصل عند الحاجة فقط.</p>
<p><b>4. حماية الأطفال والمراجعة:</b> تحتفظ الإدارة بحق مراجعة الألفاظ والرسائل والمنشورات والتعليقات والوسائط، وفلترتها حسب الأخلاق المجتمعية الإسلامية. أي ألفاظ أو محتوى مخالف يُمنع ويُحذف نهائيًا، ويُخطَر الطالب وولي الأمر بإنذار أول. إذا تكرر الخطأ يُقفل الحساب نهائيًا.</p>
<p><b>5. النشر:</b> نشر المنشورات والفيديو متاح للبالغين (18 سنة فأكثر) أو للناشرين المعتمدين من الإدارة. يستطيع الطفل التعليق والإعجاب والمشاركة.</p>
<p><b>6. الأصدقاء والخصوصية:</b> لا يمكن إضافة صديق إلا عبر صديق مشترك أو مجموعة مشتركة. تظهر حالة الاتصال والصورة للأصدقاء فقط. الرسائل والمنشورات تُرى بين الأصدقاء فقط.</p>
<p><b>7. من يطّلع على البيانات:</b> لا تُعرض بيانات الطفل الشخصية (التاريخ والهواتف) إلا لإدارة التطبيق. المحادثات الخاصة يمكن للإدارة مراجعتها عند وجود بلاغ أو مخالفة.</p>
<p><b>8. الاحتفاظ بالبيانات وحذفها:</b> تُحذف الرسائل والإشعارات والمخالفات القديمة تلقائيًا بعد مدة محددة (الرسائل والمخالفات سنة، والإشعارات المقروءة 90 يومًا). يستطيع الطالب أو ولي الأمر طلب حذف الحساب وكل بياناته من داخل الإعدادات أو عبر الإدارة.</p>
<p><b>9. الأمان:</b> كلمات المرور مشفّرة ولا تظهر لأحد. لا تشارك كلمة المرور مع أحد.</p>
<p><b>10. التواصل:</b> لأي استفسار أو طلب خصوصية، تواصل مع إدارة التطبيق عبر ولي الأمر.</p>`;
