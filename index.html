function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;

function fix(w){w=w.toLowerCase();if(w.length<3||D[w]||SW.has(w))return w;
if(U&&U.words.some(x=>x.en===w))return w;
let best=w,bd=9;const pool=Object.keys(D).concat(U?U.words.map(x=>x.en):[]);
for(const p of pool){if(Math.abs(p.length-w.length)>2||p.includes(' '))continue;const d=lev(w,p);if(d<bd){bd=d;best=p}}
return bd<=(w.length>4?2:1)?best:w}
